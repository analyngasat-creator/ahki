<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* Enforces maximum layout layer priority so text NEVER gets covered up */
        h1 {
            font-size: 1.6rem;
            color: #000000;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.3;
            transition: color 0.2s ease;
            position: relative;
            z-index: 999999; /* Higher layer priority than the expanding Yes button */
        }

        .gif-space {
            width: 100%;
            height: 200px;
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 100; /* Keeps the sticker clear */
        }

        .gif-space img {
            height: 100%;
            width: 200px;
            object-fit: contain;
            display: block;
        }

        .button-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            height: 50px;
            position: relative;
        }

        button {
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
        }

        #yesBtn {
            background-color: #4caf50; /* Green */
            z-index: 99999; /* Massive but stays under the text layer */
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }

        #noBtn {
            background-color: #f44336; /* Red */
            position: absolute;
            z-index: 10;
        }

        #successView {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #successView h2 {
            font-size: 1.8rem;
            color: #000000;
            font-weight: 700;
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="main-wrapper" id="questionView">
        <h1 id="invitationText">Hello Miss Ahkicia, can we go on a date on Sunday, June 7, 2026?</h1>

        <div class="gif-space">
            <img id="catImg" src="cat.gif" alt="Asking Cat Sticker">
        </div>
        
        <div class="button-row">
            <button id="yesBtn" onclick="accepted()">Yes</button>
            <button id="noBtn" onmouseover="runAndGrow()" onclick="runAndGrow()">No</button>
        </div>
    </div>

    <div class="main-wrapper" id="successView">
        <div class="gif-space">
            <img src="happy.gif" alt="Celebrating Cat Sticker">
        </div>
        <h2>Yay! See you on Sunday! 🥰</h2>
    </div>

    <script>
        let scaleFactor = 1;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const textNode = document.getElementById('invitationText');

        const pleadingMessages = [
            "Please, pretty please? 🥺",
            "Think about it again... Pretty please? 👉👈",
            "Don't be like that, please pretty please? ❤️",
            "Say yes please! 😭"
        ];
        let promptIndex = 0;

        window.onload = () => {
            const rowWidth = document.querySelector('.button-row').offsetWidth;
            yesBtn.style.position = 'absolute';
            yesBtn.style.left = (rowWidth / 2 - yesBtn.offsetWidth - 10) + 'px';
            noBtn.style.left = (rowWidth / 2 + 10) + 'px';
        };

        function runAndGrow() {
            scaleFactor += 0.65;
            yesBtn.style.transform = `scale(${scaleFactor})`;

            if (promptIndex < pleadingMessages.length) {
                textNode.innerText = pleadingMessages[promptIndex];
                promptIndex++;
            } else {
                textNode.innerText = "Please say yes! 💖";
            }

            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function accepted() {
            document.getElementById('questionView').style.display = 'none';
            document.getElementById('successView').style.display = 'flex';
            noBtn.style.display = 'none';
        }
    </script>

</body>
</html>
